# Estilos principales del plan de estudios
styles:
  version: 1.x
  css:
    theme:
      css/plan-de-estudios.css: {}
      

# Iconos de Font Awesome
font-awesome:
  version: 5.15.4
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css: { type: external, minified: true }

# Fuente Open Sans
open-sans:
