malla_curricular.display:
  path: '/malla-curricular'
  defaults:
    _controller: '\Drupal\malla_curricular\Controller\MallaCurricularController::display'
    _title: 'Malla Curricular'
  requirements:
    _permission: 'access content'

malla_curricular.carrera:
  path: '/malla-curricular/{id_carrera}'
  defaults:
    _controller: '\Drupal\malla_curricular\Controller\MallaCurricularController::carreraDetail'
    _title: 'Detalle de Carrera'
  requirements:
    _permission: 'access content'

malla_curricular.descargar_pdf:
  path: '/malla-curricular/descargar/{id_carrera}'
  defaults:
    _controller: '\Drupal\malla_curricular\Controller\MallaCurricularController::descargarPdf'
    _title: 'Descargar PDF'
  requirements:
    _permission: 'access content'