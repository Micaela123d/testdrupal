phpcs_tests.confirm:
  path: '/admin/reports/phpcs_tests/confirm'
  defaults:
    _form: '\Drupal\phpcs_tests\Form\PhpcsTestsClearLogConfirmForm'
    _title: 'Confirm delete recent log messages'
  requirements:
    _permission: 'administer site configuration'

phpcs_tests.phpcs_report:
  path: '/admin/phpcs_tests/reports'
  defaults:
    _controller: '\Drupal\phpcs_tests\Controller\PhpcsTestsController::overview'
    _title: 'PHPCS Tests Report'
  requirements:
    _permission: 'administer site configuration'

phpcs_tests.event:
  path: '/admin/phpcs_tests/reports/event/{event_id}'
  defaults:
    _controller: '\Drupal\phpcs_tests\Controller\PhpcsTestsController::eventDetails'
    _title: 'Details'
  requirements:
    _permission: 'administer site configuration'
    event_id: '[0-9]+'
